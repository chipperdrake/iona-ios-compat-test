name: Iona Maya1 physical iPhone build
on:
  push:
    paths:
      - '.github/workflows/iona-ios-device.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ios-maya1:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - name: Check out audit repository for packaging script
        uses: actions/checkout@v4
      - name: Fetch public source
        run: |
          git clone https://github.com/0xShug0/audio.cpp.git /tmp/audio-cpp
          cd /tmp/audio-cpp
          git checkout --detach 4faef969850e2dd485e717fe2159875b91cfa3dc
          test "$(git rev-parse HEAD)" = "4faef969850e2dd485e717fe2159875b91cfa3dc"
          git submodule update --init --depth 1
      - name: Work around vendored SentencePiece Xcode helper omission
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/audio-cpp/external/sentencepiece/src/CMakeLists.txt')
          t=p.read_text()
          helper='''function(set_xcode_property target property value config)\n  if(TARGET ${target})\n    set_property(TARGET ${target} PROPERTY XCODE_ATTRIBUTE_${property} "${value}")\n  endif()\nendfunction()\n'''
          assert 'set_xcode_property(' in t
          p.write_text(helper+chr(10)+t)
          print('Inserted scoped CMake helper into temporary test checkout only')
          PY
      - name: Install Ninja build tool
        run: brew install ninja
      - name: Configure for physical iPhone without optional OpenMP
        run: |
          cmake -S /tmp/audio-cpp -B /tmp/iona-build -G Ninja \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=17.0 \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO \
            -DBUILD_SHARED_LIBS=OFF \
            -DENGINE_ENABLE_METAL=OFF \
            -DENGINE_ENABLE_OPENMP=OFF \
            -DENGINE_ENABLE_NATIVE_CPU=OFF \
            -DAUDIOCPP_MODEL_SET=custom \
            -DAUDIOCPP_MODELS=maya1 \
            -DAUDIOCPP_BUILD_C_API=OFF
      - name: Compile audio.cpp for physical iPhone
        run: cmake --build /tmp/iona-build --config Release --target engine_runtime --parallel 2
      - name: Compile missing C ABI implementation for link probe
        run: |
          mkdir -p /tmp/iona-link-probe
          sdk="$(xcrun --sdk iphoneos --show-sdk-path)"
          cxx="$(xcrun --sdk iphoneos --find clang++)"
          "$cxx" -std=c++17 -arch arm64 -isysroot "$sdk" -miphoneos-version-min=17.0 \
            -I /tmp/audio-cpp/include \
            -I /tmp/audio-cpp/src \
            -I /tmp/audio-cpp/external/ggml/include \
            -I /tmp/iona-build/generated \
            -DAUDIOCPP_VERSION_STRING='"0.2.1"' \
            -c /tmp/audio-cpp/src/capi/audiocpp.cpp \
            -o /tmp/iona-link-probe/audiocpp-capi.o
      - name: Attempt weight-free iPhone C ABI link map
        run: |
          mkdir -p /tmp/iona-link-probe
          sdk="$(xcrun --sdk iphoneos --show-sdk-path)"
          clang="$(xcrun --sdk iphoneos --find clang)"
          set +e
          "$clang" -arch arm64 -isysroot "$sdk" -miphoneos-version-min=17.0 \
            -I /tmp/audio-cpp/include tests/iona_ios_link_probe.c \
            /tmp/iona-link-probe/audiocpp-capi.o \
            /tmp/iona-build/libengine_runtime.a \
            -Wl,-map,/tmp/iona-link-probe/iona-link.map \
            -o /tmp/iona-link-probe/iona-link-probe \
            > /tmp/iona-link-probe/link.stdout 2> /tmp/iona-link-probe/link.stderr
          status=$?
          set -e
          echo "$status" > /tmp/iona-link-probe/link.exitcode
          echo "Link attempt exit code: $status"
          if [ "$status" -ne 0 ]; then
            echo "Link attempt is diagnostic only; unresolved dependencies require follow-up."
            tail -80 /tmp/iona-link-probe/link.stderr
          fi
      - name: Upload iPhone link probe evidence
        uses: actions/upload-artifact@v4
        with:
          name: iona-iphone-link-probe
          path: /tmp/iona-link-probe
          retention-days: 7
      - name: Inventory Maya1 and SNAC objects
        run: |
          echo 'MAYA1 AND SNAC OBJECT FILES (DEVICE TARGET):'
          find /tmp/iona-build -type f \( -iname '*maya*' -o -iname '*snac*' \) -print | head -100
          echo 'BUILD LIBRARIES:'
          find /tmp/iona-build -type f -name '*.a' -print | head -50

      - name: Capture archive member and symbol evidence
        run: |
          mkdir -p /tmp/iona-link-audit
          find /tmp/iona-build -type f -name '*.a' -print0 | while IFS= read -r -d '' archive; do
            base="$(basename "$archive")"
            ar -t "$archive" > "/tmp/iona-link-audit/${base}.members.txt"
            nm -gU "$archive" > "/tmp/iona-link-audit/${base}.symbols.txt" 2>&1 || true
          done
          find /tmp/iona-build -type f -name '*.a' -print > /tmp/iona-link-audit/archives.txt
          test "$(find /tmp/iona-link-audit -name '*.members.txt' | wc -l | tr -d ' ')" -eq 8
          printf 'Archive symbols and members are NOT a final application linker map.\n' > /tmp/iona-link-audit/README.txt
      - name: Upload archive linkage evidence
        uses: actions/upload-artifact@v4
        with:
          name: iona-static-linkage-evidence
          path: /tmp/iona-link-audit
          retention-days: 7
      - name: Package device libraries, public headers, and source licenses
        run: |
          mkdir -p /tmp/iona-package/lib /tmp/iona-package/include /tmp/iona-package/licenses
          find /tmp/iona-build -type f -name '*.a' -exec cp {} /tmp/iona-package/lib/ \;
          cp -R /tmp/audio-cpp/include/. /tmp/iona-package/include/
          for file in LICENSE LICENSE.md COPYING NOTICE; do
            if [ -f "/tmp/audio-cpp/$file" ]; then cp "/tmp/audio-cpp/$file" /tmp/iona-package/licenses/; fi
          done
          bash scripts/package_iona_licenses.sh /tmp/audio-cpp /tmp/iona-package
          printf 'Unsigned iPhone ARM64 static libraries. Not an installable app; no model weights included. Commercial redistribution and dependencies require separate audit.\n' > /tmp/iona-package/README.txt
          du -sh /tmp/iona-package
      - name: Upload iPhone ARM64 build package
        uses: actions/upload-artifact@v4
        with:
          name: iona-maya1-iphone-arm64-libraries
          path: /tmp/iona-package
          retention-days: 7
